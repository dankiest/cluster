apiVersion: v1
kind: ConfigMap
metadata:
  name: apicurio-configmap
  namespace: apicurio
data:
  keycloak-url:  http://keycloak.auth.svc.cluster.local:8080/auth
  apicurio-ui-logout-redirect-uri: /
  apicurio-ui-hub-api-url: https://apicurio-dev.unifor.br/studio-api
  apicurio-ui-editing-url: wss://apicurio-dev.unifor.br
  apicurio-microcks-api-url:  http://MICROCKS_URL/api
  apicurio-db-connection-url: jdbc:postgresql://172.20.0.89:5432/apicurio
  apicurio-kc-client-id: apicurio-studio
  apicurio-kc-realm: Apicurio
  apicurio-microcks-client-id: microcks-serviceaccount
  apicurio-ui-feature-share-with-everyone: "true"
  apicurio-ui-feature-microcks: "false"
